<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>小さな本棚</title>

<style>
:root {
  --bg: #ffffff;
  --fg: #222222;
  --panel: #f4f5f7;
  --border: #d8dbe0;
  --mark: #a8d5ff;
  --accent: #1677d2;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
}

body.dark {
  --bg: #171717;
  --fg: #eeeeee;
  --panel: #262626;
  --border: #454545;
  --mark: #28547c;
  --accent: #72b7ff;
}

button, input, textarea {
  font: inherit;
}

button {
  padding: 10px 13px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--panel);
  color: var(--fg);
  cursor: pointer;
}

button.primary {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

button:disabled {
  opacity: 0.35;
}

input, textarea {
  width: 100%;
  padding: 11px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--bg);
  color: var(--fg);
}

textarea {
  min-height: 240px;
  line-height: 1.8;
  resize: vertical;
}

header {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 13px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}

h1 {
  margin: 0;
  font-size: 20px;
}

main {
  max-width: 900px;
  margin: auto;
  padding: 14px;
}

h2 {
  overflow-wrap: anywhere;
}

.hidden {
  display: none !important;
}

.row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.stack {
  display: grid;
  gap: 10px;
}

.card {
  padding: 13px;
  border: 1px solid var(--border);
  border-radius: 11px;
  background: var(--panel);
}

.work-button,
.chapter-button {
  width: 100%;
  text-align: left;
}

.subtle {
  font-size: 13px;
  opacity: 0.7;
}

label {
  display: block;
  margin: 12px 0 5px;
  font-size: 14px;
}

.chapter-list {
  display: grid;
  gap: 8px;
  margin-top: 12px;
}

.chapter-row {
  display: flex;
  align-items: stretch;
  gap: 6px;
}

.chapter-row .chapter-button {
  flex: 1;
  min-width: 0;
  overflow-wrap: anywhere;
}

.reader-heading {
  margin: 10px 0;
  font-weight: bold;
}

.reader-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin: 12px 0;
}

.reader-toolbar button {
  padding: 8px 10px;
}

.notice {
  padding: 10px;
  margin-bottom: 10px;
  border-radius: 8px;
  background: var(--panel);
  font-size: 13px;
  line-height: 1.7;
}

/* 読書画面：縦書きの連続横スクロール */
.reading-shell {
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg);
}

.reading-area {
  width: 100%;
  height: 70vh;
  min-height: 320px;
  overflow-x: auto;
  overflow-y: hidden;
  direction: rtl;
  overscroll-behavior-x: contain;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-x;
  scrollbar-width: thin;
}

.reading-text {
  width: max-content;
  min-width: 100%;
  height: 100%;
  padding: 18px;
  writing-mode: vertical-rl;
  text-orientation: upright;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.9;
  letter-spacing: 0.04em;
  font-size: var(--reader-size, 20px);
}

.text-line {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.text-line.marked {
  background: var(--mark);
  border-radius: 3px;
}

.reader-nav {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: 12px;
}

.reader-nav button {
  min-width: 95px;
}

@media (max-width: 480px) {
  main {
    padding: 10px;
  }

  .reading-area {
    height: 70vh;
  }

  .reading-text {
    padding: 14px;
  }
}
</style>
</head>

<body>

<header>
  <h1>小さな本棚</h1>
  <button id="homeBtn">本棚へ</button>
</header>

<main>

<!-- 本棚 -->
<section id="shelfView">
  <div class="row">
    <button class="primary" id="addWorkBtn">作品を追加</button>
    <button id="backupBtn">バックアップ</button>
    <button id="restoreBtn">復元</button>
    <input id="restoreInput" type="file" accept=".json,application/json" class="hidden">
  </div>

  <p class="subtle">
    作品と本文はこの端末に保存されます。
  </p>

  <div id="worksList" class="stack"></div>
</section>

<!-- 作品内の話一覧 -->
<section id="workView" class="hidden">
  <div class="row">
    <button id="backShelfBtn">← 本棚</button>
    <button class="primary" id="addChapterBtn">話を追加</button>
    <button id="renameWorkBtn">作品名変更</button>
    <button id="deleteWorkBtn">作品を削除</button>
  </div>

  <h2 id="workHeading"></h2>
  <div id="chaptersList" class="chapter-list"></div>
</section>

<!-- 話の編集 -->
<section id="editorView" class="hidden">
  <div class="row">
    <button id="cancelEditorBtn">← 戻る</button>
    <strong id="editorHeading">話を追加</strong>
  </div>

  <label for="chapterTitle">話のタイトル</label>
  <input id="chapterTitle" placeholder="第一話　はじまり">

  <label for="chapterBody">本文</label>
  <textarea id="chapterBody"
    placeholder="ここに本文を入力、またはコピーした文章を貼り付けます。"></textarea>

  <div class="row" style="margin-top:10px">
    <button class="primary" id="saveChapterBtn">保存</button>
    <button id="deleteChapterBtn" class="hidden">この話を削除</button>
  </div>
</section>

<!-- 読書画面 -->
<section id="readerView" class="hidden">
  <div class="row">
    <button id="backWorkBtn">← 話一覧</button>
  </div>

  <div class="reader-heading" id="readerWorkTitle"></div>
  <div class="subtle" id="readerChapterTitle"></div>

  <div class="reader-toolbar">
    <button id="smallerBtn">文字 −</button>
    <button id="largerBtn">文字 ＋</button>
    <button id="themeBtn">黒背景</button>
    <button id="markBtn">マーカー解除</button>
  </div>

  <div class="notice">
    縦書きで右から左へ読み進めます。本文を左右にスワイプしてください。<br>
    行をタップすると青くマークされます。読書位置とマーカーは自動保存されます。
  </div>

  <div class="reading-shell">
    <div class="reading-area" id="readingArea">
      <div class="reading-text" id="readingText"></div>
    </div>
  </div>

  <div class="reader-nav">
    <button id="prevChapterBtn">前の話</button>
    <button id="nextChapterBtn">次の話</button>
  </div>
</section>

</main>

<script>
const DATA_KEY = "smallLibrary.continuous.data";
const SETTINGS_KEY = "smallLibrary.continuous.settings";

let db = loadDB();
let settings = loadSettings();

let currentWorkId = null;
let currentChapterId = null;
let editingChapterId = null;

const $ = id => document.getElementById(id);

function uid() {
  return Date.now().toString(36) +
    Math.random().toString(36).slice(2, 9);
}

function loadDB() {
  try {
    const data = JSON.parse(localStorage.getItem(DATA_KEY));
    if (data && Array.isArray(data.works)) return data;
  } catch (e) {}

  return { works: [] };
}

function loadSettings() {
  try {
    return Object.assign(
      { fontSize: 20, dark: false },
      JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}")
    );
  } catch (e) {
    return { fontSize: 20, dark: false };
  }
}

function saveDB() {
  try {
    localStorage.setItem(DATA_KEY, JSON.stringify(db));
  } catch (e) {
    alert("保存できませんでした。容量不足の可能性があります。バックアップを確認してください。");
  }
}

function saveSettings() {
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
  applyTheme();
}

function applyTheme() {
  document.body.classList.toggle("dark", settings.dark);
  document.documentElement.style.setProperty(
    "--reader-size", settings.fontSize + "px"
  );

  $("themeBtn").textContent =
    settings.dark ? "白背景" : "黒背景";
}

function getWork() {
  return db.works.find(w => w.id === currentWorkId);
}

function getChapter() {
  const w = getWork();
  return w && w.chapters.find(c => c.id === currentChapterId);
}

function showView(id) {
  ["shelfView", "workView", "editorView", "readerView"]
    .forEach(view => {
      $(view).classList.toggle("hidden", view !== id);
    });

  $("homeBtn").classList.toggle("hidden", id === "shelfView");
}

function renderShelf() {
  const list = $("worksList");
  list.replaceChildren();

  if (!db.works.length) {
    const empty = document.createElement("div");
    empty.className = "card subtle";
    empty.textContent = "まだ作品がありません。「作品を追加」から作成できます。";
    list.appendChild(empty);
    return;
  }

  db.works.forEach(w => {
    const button = document.createElement("button");
    button.className = "card work-button";

    const title = document.createElement("strong");
    title.textContent = w.title;

    const count = document.createElement("div");
    count.className = "subtle";
    count.textContent = w.chapters.length + "話";

    button.append(title, count);

    button.onclick = () => {
      currentWorkId = w.id;
      renderWork();
      showView("workView");
    };

    list.appendChild(button);
  });
}

function renderWork() {
  const w = getWork();
  if (!w) return;

  $("workHeading").textContent = w.title;

  const list = $("chaptersList");
  list.replaceChildren();

  if (!w.chapters.length) {
    const empty = document.createElement("div");
    empty.className = "card subtle";
    empty.textContent = "まだ話がありません。「話を追加」から本文を入れてください。";
    list.appendChild(empty);
    return;
  }

  w.chapters.forEach((c, index) => {
    const row = document.createElement("div");
    row.className = "chapter-row";

    const readButton = document.createElement("button");
    readButton.className = "card chapter-button";
    readButton.textContent =
      (index + 1) + "　" + (c.title || "無題");

    readButton.onclick = () => openReader(c.id);

    const editButton = document.createElement("button");
    editButton.textContent = "編集";
    editButton.onclick = () => openEditor(c.id);

    row.append(readButton, editButton);
    list.appendChild(row);
  });
}

function openEditor(id = null) {
  editingChapterId = id;

  const w = getWork();
  const c = id ? w.chapters.find(x => x.id === id) : null;

  $("editorHeading").textContent = c ? "話を編集" : "話を追加";
  $("chapterTitle").value = c ? c.title : "";
  $("chapterBody").value = c ? c.text : "";

  $("deleteChapterBtn").classList.toggle("hidden", !c);
  showView("editorView");
}

function saveChapter() {
  const w = getWork();
  if (!w) return;

  const title = $("chapterTitle").value.trim();
  const text = $("chapterBody").value;

  if (editingChapterId) {
    const c = w.chapters.find(x => x.id === editingChapterId);
    if (c) {
      c.title = title;
      c.text = text;
    }
  } else {
    w.chapters.push({
      id: uid(),
      title,
      text,
      scrollLeft: 0,
      marked: null
    });
  }

  saveDB();
  renderWork();
  showView("workView");
}

function openReader(id) {
  currentChapterId = id;

  const c = getChapter();
  if (!c) return;

  $("readerWorkTitle").textContent = getWork().title;
  $("readerChapterTitle").textContent = c.title || "無題";

  renderReader();
  showView("readerView");

  requestAnimationFrame(() => {
    $("readingArea").scrollLeft = c.scrollLeft || 0;
  });
}

function renderReader() {
  const c = getChapter();
  if (!c) return;

  const textElement = $("readingText");
  textElement.replaceChildren();

  const lines = (c.text || "").split("\n");

  lines.forEach((line, index) => {
    const span = document.createElement("span");
    span.className = "text-line";
    span.textContent = line || "　";

    if (c.marked === index) {
      span.classList.add("marked");
    }

    span.addEventListener("click", () => {
      c.marked = c.marked === index ? null : index;
      saveDB();
      renderReader();
    });

    textElement.appendChild(span);

    if (index < lines.length - 1) {
      textElement.appendChild(document.createTextNode("\n"));
    }
  });

  const w = getWork();
  const index = w.chapters.findIndex(x => x.id === currentChapterId);

  $("prevChapterBtn").disabled = index <= 0;
  $("nextChapterBtn").disabled = index >= w.chapters.length - 1;

  $("markBtn").textContent =
    c.marked === null || c.marked === undefined
      ? "マーカーなし"
      : "マーカー解除";
}

function moveChapter(delta) {
  const w = getWork();
  const index = w.chapters.findIndex(c => c.id === currentChapterId);
  const next = w.chapters[index + delta];

  if (next) openReader(next.id);
}

/* 作品の追加 */
$("addWorkBtn").onclick = () => {
  const title = prompt("作品タイトルを入力してください");
  if (!title || !title.trim()) return;

  const w = {
    id: uid(),
    title: title.trim(),
    chapters: []
  };

  db.works.push(w);
  currentWorkId = w.id;

  saveDB();
  renderShelf();
  renderWork();
  showView("workView");
};

/* 作品名の変更 */
$("renameWorkBtn").onclick = () => {
  const w = getWork();
  if (!w) return;

  const title = prompt("作品タイトル", w.title);

  if (title && title.trim()) {
    w.title = title.trim();
    saveDB();
    renderShelf();
    renderWork();
  }
};

/* 作品の削除 */
$("deleteWorkBtn").onclick = () => {
  const w = getWork();
  if (!w) return;

  if (confirm("「" + w.title + "」を削除しますか？")) {
    db.works = db.works.filter(x => x.id !== w.id);
    currentWorkId = null;

    saveDB();
    renderShelf();
    showView("shelfView");
  }
};

/* 話の編集・保存・削除 */
$("addChapterBtn").onclick = () => openEditor();

$("saveChapterBtn").onclick = saveChapter;

$("cancelEditorBtn").onclick = () => {
  renderWork();
  showView("workView");
};

$("deleteChapterBtn").onclick = () => {
  if (!confirm("この話を削除しますか？")) return;

  const w = getWork();
  w.chapters = w.chapters.filter(c => c.id !== editingChapterId);

  saveDB();
  renderWork();
  showView("workView");
};

/* 画面移動 */
$("backShelfBtn").onclick = () => {
  renderShelf();
  showView("shelfView");
};

$("backWorkBtn").onclick = () => {
  renderWork();
  showView("workView");
};

$("homeBtn").onclick = () => {
  renderShelf();
  showView("shelfView");
};

/* 読書設定 */
$("smallerBtn").onclick = () => {
  settings.fontSize = Math.max(12, settings.fontSize - 2);
  saveSettings();
};

$("largerBtn").onclick = () => {
  settings.fontSize = Math.min(36, settings.fontSize + 2);
  saveSettings();
};

$("themeBtn").onclick = () => {
  settings.dark = !settings.dark;
  saveSettings();
};

$("markBtn").onclick = () => {
  const c = getChapter();
  if (!c) return;

  c.marked = null;
  saveDB();
  renderReader();
};

$("prevChapterBtn").onclick = () => moveChapter(-1);
$("nextChapterBtn").onclick = () => moveChapter(1);

/* 読書位置を自動保存 */
let scrollSaveTimer;

$("readingArea").addEventListener("scroll", () => {
  const c = getChapter();
  if (!c) return;

  clearTimeout(scrollSaveTimer);

  scrollSaveTimer = setTimeout(() => {
    c.scrollLeft = $("readingArea").scrollLeft;
    saveDB();
  }, 150);
}, { passive: true });

/* バックアップ */
$("backupBtn").onclick = () => {
  const payload = {
    format: "small-library-backup-v1",
    db,
    settings
  };

  const blob = new Blob(
    [JSON.stringify(payload, null, 2)],
    { type: "application/json" }
  );

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download = "小さな本棚バックアップ.json";
  a.click();

  setTimeout(() => URL.revokeObjectURL(url), 1000);
};

/* 復元 */
$("restoreBtn").onclick = () => $("restoreInput").click();

$("restoreInput").onchange = async event => {
  const file = event.target.files[0];
  if (!file) return;

  try {
    const payload = JSON.parse(await file.text());
    const restored = payload.db || payload;

    if (!Array.isArray(restored.works)) {
      throw new Error("invalid backup");
    }

    if (confirm("現在の本棚をバックアップ内容で置き換えますか？")) {
      db = restored;
      settings = payload.settings || settings;

      saveDB();
      saveSettings();
      renderShelf();
      showView("shelfView");

      alert("復元しました。");
    }
  } catch (error) {
    alert("復元できませんでした。正しいJSONバックアップを選んでください。");
  }

  event.target.value = "";
};

/* 初期化 */
applyTheme();
renderShelf();
showView("shelfView");

/* オフライン用Service Worker */
if ("serviceWorker" in navigator &&
    location.protocol.startsWith("http")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>

</body>
</html>
