<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5efe6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小さな本棚">
<link rel="manifest" href="./manifest.webmanifest">
<title>小さな本棚</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#f5efe6;color:#332b25}
main{max-width:560px;margin:auto;min-height:100vh;padding:28px 18px calc(28px + env(safe-area-inset-bottom))}
.badge{font-size:12px;letter-spacing:.12em;color:#806d5c}h1{font-size:30px;margin:10px 0}p{line-height:1.7}
.card{margin-top:18px;padding:18px;border-radius:18px;background:#fffaf4;box-shadow:0 8px 24px #55402a12}
label{display:block;font-weight:650;margin:12px 0 6px}input,textarea{width:100%;border:1px solid #ddcdbd;border-radius:12px;padding:12px;font:inherit;background:white;color:#332b25}
textarea{min-height:180px;resize:vertical}button{border:0;border-radius:12px;padding:13px 15px;font-size:16px;font-weight:650;background:#73543e;color:white;margin-top:10px}
button.secondary{background:#e8d9c9;color:#332b25}.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1}
.book{border-top:1px solid #eaded1;padding:12px 0}.book h3{margin:0 0 5px}.muted{font-size:13px;color:#806d5c}.status{font-size:13px;color:#806d5c;margin-top:10px}
</style>
</head>
<body>
<main>
<div class="badge">MY OFFLINE LIBRARY</div>
<h1>小さな本棚 📚</h1>
<p>自分だけの小説を保存する小さな本棚です。初回にページを読み込んだ後は、オフラインで使えるように設計しています。</p>
<section class="card">
<h2 style="margin-top:0">小説を書く</h2>
<label for="title">タイトル</label><input id="title" maxlength="100" placeholder="例：星降る夜に">
<label for="body">本文</label><textarea id="body" placeholder="ここに小説を書いてね…"></textarea>
<div class="row"><button id="save">小説を保存</button><button class="secondary" id="clear">入力を消す</button></div>
<div class="status" id="status" role="status">保存先：このiPhoneのブラウザ内</div>
</section>
<section class="card">
<h2 style="margin-top:0">本棚</h2><div id="library"><p class="muted">まだ小説はありません。</p></div>
</section>
<section class="card">
<h2 style="margin-top:0">オフラインについて</h2>
<p class="muted">最初に公開ページをSafariで開いて読み込み、ホーム画面に追加してください。保存した小説はこの端末のブラウザ内に保存されます。ブラウザのデータ消去や端末変更で失われる場合があるため、大切な作品は別にもバックアップしてください。</p>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
let books=[];
try{books=JSON.parse(localStorage.getItem('small-books')||'[]')}catch(e){}
function render(){
 const root=$('library'); root.innerHTML='';
 if(!books.length){root.innerHTML='<p class="muted">まだ小説はありません。</p>';return;}
 books.forEach((b,i)=>{
  const el=document.createElement('div');el.className='book';
  const h=document.createElement('h3');h.textContent=b.title||'無題';
  const p=document.createElement('p');p.className='muted';p.textContent=(b.text||'').slice(0,100)+(b.text.length>100?'…':'');
  const row=document.createElement('div');row.className='row';
  const read=document.createElement('button');read.textContent='読む／編集';read.onclick=()=>{$('title').value=b.title;$('body').value=b.text;window.scrollTo({top:0,behavior:'smooth'});};
  const del=document.createElement('button');del.textContent='削除';del.className='secondary';del.onclick=()=>{if(confirm('この小説を削除しますか？')){books.splice(i,1);persist();}};
  row.append(read,del);el.append(h,p,row);root.append(el);
 });
}
function persist(){try{localStorage.setItem('small-books',JSON.stringify(books));$('status').textContent='保存しました！';render()}catch(e){$('status').textContent='保存できませんでした。空き容量を確認してください。'}}
$('save').onclick=()=>{const title=$('title').value.trim()||'無題';const text=$('body').value;if(!text.trim()){ $('status').textContent='本文を入力してね。';return;}books.unshift({title,text,updated:new Date().toISOString()});persist();$('title').value='';$('body').value='';};
$('clear').onclick=()=>{$('title').value='';$('body').value='';};
render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{$('status').textContent='オフライン準備に失敗しました。ページを再読み込みしてください。';}));}
</script>
</body>
</html>
