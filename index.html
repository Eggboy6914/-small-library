<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>小さな本棚</title>

<style>
:root {
  --bg: #ffffff;
  --fg: #222222;
  --panel: #f4f5f7;
  --border: #d8dbe0;
  --mark: #a8d5ff;
  --accent: #1677d2;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
}

body.dark {
  --bg: #171717;
  --fg: #eeeeee;
  --panel: #262626;
  --border: #454545;
  --mark: #28547c;
  --accent: #72b7ff;
}

button, input, textarea {
  font: inherit;
}

button {
  padding: 10px 13px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--panel);
  color: var(--fg);
  cursor: pointer;
}

button.primary {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

button:disabled {
  opacity: .35;
}

input, textarea {
  width: 100%;
  padding: 11px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--bg);
  color: var(--fg);
}

textarea {
  min-height: 240px;
  line-height: 1.8;
  resize: vertical;
}

header {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 13px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}

h1 {
  margin: 0;
  font-size: 20px;
}

h2 {
  overflow-wrap: anywhere;
}

main {
  max-width: 900px;
  margin: auto;
  padding: 14px;
}

.hidden {
  display: none !important;
}

.row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.stack {
  display: grid;
  gap: 10px;
}

.card {
  padding: 13px;
  border: 1px solid var(--border);
  border-radius: 11px;
  background: var(--panel);
}

.work-button, .chapter-button {
  width: 100%;
  text-align: left;
}

.subtle {
  font-size: 13px;
  opacity: .7;
}

label {
  display: block;
  margin: 12px 0 5px;
  font-size: 14px;
}

.chapter-list {
  display: grid;
  gap: 8px;
  margin-top: 12px;
}

.chapter-row {
  display: flex;
  align-items: stretch;
  gap: 6px;
}

.chapter-row .chapter-button {
  flex: 1;
  min-width: 0;
  overflow-wrap: anywhere;
}

.reader-heading {
  margin: 10px 0;
  font-weight: bold;
}

.reader-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin: 12px 0;
}

.reader-toolbar button {
  padding: 8px 10px;
}

.notice {
  padding: 10px;
  margin-bottom: 10px;
  border-radius: 8px;
  background: var(--panel);
  font-size: 13px;
  line-height: 1.7;
}

/* 読書画面 */
.reading-shell {
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg);
}

/*
  横書きで表示し、上下にスクロールする。
  横方向のスクロールは無効にする。
*/
.reading-area {
  position: relative;
  width: 100%;
  height: 70vh;
  height: 70dvh;
  min-height: 360px;

  overflow-x: hidden;
  overflow-y: auto;

  direction: ltr;
  overscroll-behavior-y: contain;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-y;
  scrollbar-width: thin;
}

/* 本文全体 */
.reading-text {
  width: 100%;
  min-width: 0;
  min-height: 100%;
  padding: 20px 22px 28px;

  writing-mode: horizontal-tb;
  text-orientation: mixed;

  white-space: normal;
  overflow-wrap: anywhere;
  word-break: normal;
  line-break: strict;

  line-height: 1.9;
  letter-spacing: .04em;
  font-size: var(--reader-size, 20px);
}

/*
  入力時の改行を維持する。
  各行を独立させ、行同士の文字の干渉を防ぐ。
*/
.text-line {
  display: block;
  width: 100%;
  min-height: 1.9em;

  white-space: pre-wrap;
  overflow-wrap: anywhere;
  word-break: normal;
  line-break: strict;
  line-height: 1.9;

  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

/* 空行も改行として表示する */
.text-line.empty-line {
  min-height: 1.9em;
}

/* マーカー */
.text-line.marked {
  background: var(--mark);
  border-radius: 3px;
}

/* 前の話は右、次の話は左 */
.reader-nav {
  display: flex;
  flex-direction: row-reverse;
  justify-content: space-between;
  gap: 10px;
  margin-top: 12px;
}

.reader-nav button {
  min-width: 95px;
  flex: 1;
}

@media (max-width: 480px) {
  main {
    padding: 10px;
  }

  .reading-area {
    height: 70vh;
    height: 70dvh;
    min-height: 360px;
  }

  .reading-text {
    padding: 18px 16px 26px;
  }
}
</style>
</head>

<body>
<header>
  <h1>小さな本棚</h1>
  <button id="homeBtn">本棚へ</button>
</header>

<main>

<section id="shelfView">
  <div class="row">
    <button class="primary" id="addWorkBtn">作品を追加</button>
    <button id="backupBtn">バックアップ</button>
    <button id="restoreBtn">復元</button>
    <input id="restoreInput" type="file"
      accept=".json,application/json" class="hidden">
  </div>

  <p class="subtle">作品と本文はこの端末に保存されます。</p>
  <div id="worksList" class="stack"></div>
</section>

<section id="workView" class="hidden">
  <div class="row">
    <button id="backShelfBtn">← 本棚</button>
    <button class="primary" id="addChapterBtn">話を追加</button>
    <button id="renameWorkBtn">作品名変更</button>
    <button id="deleteWorkBtn">作品を削除</button>
  </div>

  <h2 id="workHeading"></h2>
  <div id="chaptersList" class="chapter-list"></div>
</section>

<section id="editorView" class="hidden">
  <div class="row">
    <button id="cancelEditorBtn">← 戻る</button>
    <strong id="editorHeading">話を追加</strong>
  </div>

  <label for="chapterTitle">話のタイトル</label>
  <input id="chapterTitle" placeholder="第一話　はじまり">

  <label for="chapterBody">本文</label>
  <textarea id="chapterBody"
    placeholder="ここに本文を入力、またはコピーした文章を貼り付けます。"></textarea>

  <div class="row" style="margin-top:10px">
    <button class="primary" id="saveChapterBtn">保存</button>
    <button id="deleteChapterBtn" class="hidden">この話を削除</button>
  </div>
</section>

<section id="readerView" class="hidden">
  <div class="row">
    <button id="backWorkBtn">← 話一覧</button>
  </div>

  <div class="reader-heading" id="readerWorkTitle"></div>
  <div class="subtle" id="readerChapterTitle"></div>

  <div class="reader-toolbar">
    <button id="smallerBtn">文字 −</button>
    <button id="largerBtn">文字 ＋</button>
    <button id="themeBtn">黒背景</button>
    <button id="markBtn">マーカー解除</button>
  </div>

  <div class="notice">
    横書きで左から右へ読みます。上下にスワイプして読み進めてください。<br>
    入力した改行はそのまま表示されます。行をタップすると青くマークされ、読書位置も自動保存されます。
  </div>

  <div class="reading-shell">
    <div class="reading-area" id="readingArea">
      <div class="reading-text" id="readingText"></div>
    </div>
  </div>

  <div class="reader-nav">
    <button id="prevChapterBtn">前の話</button>
    <button id="nextChapterBtn">次の話</button>
  </div>
</section>

</main>

<script>
const DATA_KEY = "smallLibrary.continuous.data";
const SETTINGS_KEY = "smallLibrary.continuous.settings";

let db = loadDB();
let settings = loadSettings();

let currentWorkId = null;
let currentChapterId = null;
let editingChapterId = null;
let scrollSaveTimer = null;
let readerRenderToken = 0;

const $ = id => document.getElementById(id);

function uid() {
  return Date.now().toString(36) +
    Math.random().toString(36).slice(2, 9);
}

function loadDB() {
  try {
    const data = JSON.parse(localStorage.getItem(DATA_KEY));
    if (data && Array.isArray(data.works)) return data;
  } catch (e) {}

  return { works: [] };
}

function loadSettings() {
  try {
    return Object.assign(
      { fontSize: 20, dark: false },
      JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}")
    );
  } catch (e) {
    return { fontSize: 20, dark: false };
  }
}

function saveDB() {
  try {
    localStorage.setItem(DATA_KEY, JSON.stringify(db));
  } catch (e) {
    alert("保存できませんでした。容量不足の可能性があります。");
  }
}

function saveSettings() {
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
  applyTheme();
}

function applyTheme() {
  document.body.classList.toggle("dark", settings.dark);

  document.documentElement.style.setProperty(
    "--reader-size",
    settings.fontSize + "px"
  );

  $("themeBtn").textContent = settings.dark ? "白背景" : "黒背景";
}

function getWork() {
  return db.works.find(w => w.id === currentWorkId);
}

function getChapter() {
  const w = getWork();
  return w && w.chapters.find(c => c.id === currentChapterId);
}

function showView(id) {
  ["shelfView", "workView", "editorView", "readerView"]
    .forEach(view => {
      $(view).classList.toggle("hidden", view !== id);
    });

  $("homeBtn").classList.toggle("hidden", id === "shelfView");
}

function renderShelf() {
  const list = $("worksList");
  list.replaceChildren();

  if (!db.works.length) {
    const empty = document.createElement("div");
    empty.className = "card subtle";
    empty.textContent =
      "まだ作品がありません。「作品を追加」から作成できます。";
    list.appendChild(empty);
    return;
  }

  db.works.forEach(w => {
    const button = document.createElement("button");
    button.className = "card work-button";

    const title = document.createElement("strong");
    title.textContent = w.title;

    const count = document.createElement("div");
    count.className = "subtle";
    count.textContent = w.chapters.length + "話";

    button.append(title, count);

    button.onclick = () => {
      currentWorkId = w.id;
      renderWork();
      showView("workView");
    };

    list.appendChild(button);
  });
}

function renderWork() {
  const w = getWork();
  if (!w) return;

  $("workHeading").textContent = w.title;

  const list = $("chaptersList");
  list.replaceChildren();

  if (!w.chapters.length) {
    const empty = document.createElement("div");
    empty.className = "card subtle";
    empty.textContent =
      "まだ話がありません。「話を追加」から本文を入れてください。";
    list.appendChild(empty);
    return;
  }

  w.chapters.forEach((c, index) => {
    const row = document.createElement("div");
    row.className = "chapter-row";

    const readButton = document.createElement("button");
    readButton.className = "card chapter-button";
    readButton.textContent = (index + 1) + "　" + (c.title || "無題");
    readButton.onclick = () => openReader(c.id);

    const editButton = document.createElement("button");
    editButton.textContent = "編集";
    editButton.onclick = () => openEditor(c.id);

    row.append(readButton, editButton);
    list.appendChild(row);
  });
}

function openEditor(id = null) {
  editingChapterId = id;

  const w = getWork();
  const c = id ? w.chapters.find(x => x.id === id) : null;

  $("editorHeading").textContent = c ? "話を編集" : "話を追加";
  $("chapterTitle").value = c ? c.title : "";
  $("chapterBody").value = c ? c.text : "";

  $("deleteChapterBtn").classList.toggle("hidden", !c);

  showView("editorView");
}

function saveChapter() {
  const w = getWork();
  if (!w) return;

  const title = $("chapterTitle").value.trim();
  const text = $("chapterBody").value;

  if (editingChapterId) {
    const c = w.chapters.find(x => x.id === editingChapterId);

    if (c) {
      c.title = title;
      c.text = text;
    }
  } else {
    w.chapters.push({
      id: uid(),
      title,
      text,
      scrollTop: 0,
      marked: null
    });
  }

  saveDB();
  renderWork();
  showView("workView");
}

/* 読書画面を開く */
function openReader(id) {
  currentChapterId = id;

  const c = getChapter();
  if (!c) return;

  $("readerWorkTitle").textContent = getWork().title;
  $("readerChapterTitle").textContent = c.title || "無題";

  renderReader();
  showView("readerView");

  requestAnimationFrame(() => {
    const area = $("readingArea");

    /* 新形式の保存位置を使用 */
    area.scrollTop = Number(c.scrollTop) || 0;
    area.scrollLeft = 0;
  });
}

/* 横書き本文を描画 */
function renderReader() {
  const c = getChapter();
  if (!c) return;

  const token = ++readerRenderToken;
  const textElement = $("readingText");

  textElement.replaceChildren();

  const body = (c.text || "").replace(/\r\n?/g, "\n");
  const lines = body.split("\n");

  if (!body.length) {
    const empty = document.createElement("div");
    empty.className = "text-line";
    empty.textContent =
      "本文がありません。話を編集して本文を入力してください。";

    textElement.appendChild(empty);
  } else {
    lines.forEach((line, index) => {
      const span = document.createElement("div");

      span.className = "text-line";
      span.dataset.line = String(index);

      /*
        空行を削除せず、改行として維持する。
        空のdivがつぶれないよう専用クラスを付ける。
      */
      if (line.length === 0) {
        span.classList.add("empty-line");
        span.textContent = "\u00a0";
      } else {
        span.textContent = line;
      }

      if (Number(c.marked) === index &&
          c.marked !== null &&
          c.marked !== undefined) {
        span.classList.add("marked");
      }

      span.addEventListener("click", () => {
        if (token !== readerRenderToken) return;

        const area = $("readingArea");
        const savedTop = area.scrollTop;

        c.marked =
          c.marked === index ? null : index;

        saveDB();
        renderReader();

        requestAnimationFrame(() => {
          area.scrollTop = savedTop;
          area.scrollLeft = 0;
        });
      });

      textElement.appendChild(span);
    });
  }

  const w = getWork();
  const index = w.chapters.findIndex(
    item => item.id === currentChapterId
  );

  $("prevChapterBtn").disabled = index <= 0;
  $("nextChapterBtn").disabled =
    index < 0 || index >= w.chapters.length - 1;

  $("markBtn").textContent =
    c.marked === null || c.marked === undefined
      ? "マーカーなし"
      : "マーカー解除";
}

function moveChapter(delta) {
  const w = getWork();
  if (!w) return;

  const index = w.chapters.findIndex(
    c => c.id === currentChapterId
  );

  const next = w.chapters[index + delta];

  if (next) {
    openReader(next.id);
  }
}

/* 作品を追加 */
$("addWorkBtn").onclick = () => {
  const title = prompt("作品タイトルを入力してください");

  if (!title || !title.trim()) return;

  const w = {
    id: uid(),
    title: title.trim(),
    chapters: []
  };

  db.works.push(w);
  currentWorkId = w.id;

  saveDB();
  renderShelf();
  renderWork();
  showView("workView");
};

/* 作品名変更 */
$("renameWorkBtn").onclick = () => {
  const w = getWork();
  if (!w) return;

  const title = prompt("作品タイトル", w.title);

  if (title && title.trim()) {
    w.title = title.trim();

    saveDB();
    renderShelf();
    renderWork();
  }
};

/* 作品削除 */
$("deleteWorkBtn").onclick = () => {
  const w = getWork();
  if (!w) return;

  const message =
    "「" + w.title + "」と、その中の全ての話を削除します。\n" +
    "この操作は元に戻せません。\n\n削除しますか？";

  if (!confirm(message)) return;

  db.works = db.works.filter(x => x.id !== w.id);

  currentWorkId = null;
  currentChapterId = null;
  editingChapterId = null;

  saveDB();
  renderShelf();
  showView("shelfView");
};

/* 話の追加・保存 */
$("addChapterBtn").onclick = () => openEditor();
$("saveChapterBtn").onclick = saveChapter;

/* 編集をキャンセル */
$("cancelEditorBtn").onclick = () => {
  renderWork();
  showView("workView");
};

/* 話を削除 */
$("deleteChapterBtn").onclick = () => {
  if (!confirm("この話を削除しますか？")) return;

  const w = getWork();
  if (!w) return;

  w.chapters = w.chapters.filter(
    c => c.id !== editingChapterId
  );

  saveDB();
  renderWork();
  showView("workView");
};

/* 一覧へ戻る */
$("backShelfBtn").onclick = () => {
  renderShelf();
  showView("shelfView");
};

$("backWorkBtn").onclick = () => {
  renderWork();
  showView("workView");
};

$("homeBtn").onclick = () => {
  renderShelf();
  showView("shelfView");
};

/* 文字サイズ */
$("smallerBtn").onclick = () => {
  settings.fontSize = Math.max(12, settings.fontSize - 2);
  saveSettings();
};

$("largerBtn").onclick = () => {
  settings.fontSize = Math.min(36, settings.fontSize + 2);
  saveSettings();
};

/* 背景テーマ */
$("themeBtn").onclick = () => {
  settings.dark = !settings.dark;
  saveSettings();
};

/* マーカー解除 */
$("markBtn").onclick = () => {
  const c = getChapter();
  if (!c) return;

  c.marked = null;

  saveDB();
  renderReader();
};

/* 前の話・次の話 */
$("prevChapterBtn").onclick = () => moveChapter(-1);
$("nextChapterBtn").onclick = () => moveChapter(1);

/* 読書位置を上下方向で保存 */
$("readingArea").addEventListener("scroll", () => {
  const c = getChapter();
  if (!c) return;

  clearTimeout(scrollSaveTimer);

  scrollSaveTimer = setTimeout(() => {
    const current = getChapter();

    if (!current || current.id !== c.id) return;

    current.scrollTop = $("readingArea").scrollTop;

    saveDB();
  }, 150);
}, { passive: true });

/* バックアップ */
$("backupBtn").onclick = () => {
  const payload = {
    format: "small-library-backup-v1",
    db,
    settings
  };

  const blob = new Blob(
    [JSON.stringify(payload, null, 2)],
    { type: "application/json" }
  );

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download = "小さな本棚バックアップ.json";
  a.click();

  setTimeout(() => URL.revokeObjectURL(url), 1000);
};

/* バックアップから復元 */
$("restoreBtn").onclick = () => {
  $("restoreInput").click();
};

$("restoreInput").onchange = async event => {
  const file = event.target.files[0];
  if (!file) return;

  try {
    const payload = JSON.parse(await file.text());
    const restored = payload.db || payload;

    if (!Array.isArray(restored.works)) {
      throw new Error("invalid backup");
    }

    if (confirm("現在の本棚をバックアップ内容で置き換えますか？")) {
      db = restored;
      settings = payload.settings || settings;

      saveDB();
      saveSettings();
      renderShelf();
      showView("shelfView");

      alert("復元しました。");
    }
  } catch (error) {
    alert("復元できませんでした。正しいJSONバックアップを選んでください。");
  }

  event.target.value = "";
};

/* 初期化 */
applyTheme();
renderShelf();
showView("shelfView");

/* オフライン対応 */
if ("serviceWorker" in navigator &&
    location.protocol.startsWith("http")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js", {
      updateViaCache: "none"
    })
    .then(registration => registration.update())
    .catch(() => {});
  });
}
</script>
</body>
</html>
